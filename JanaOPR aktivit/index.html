                  <div className="bg-emerald-600 text-white p-4 rounded-2xl shrink-0 h-[20%] overflow-hidden">

    const TemplateT3 = ({ data, images }) => (
      <div id="report-element" className="flex flex-col h-full bg-slate-50 overflow-hidden uppercase w-full">
          <div className="bg-slate-900 text-white p-6 rounded-b-[2.5rem] shadow-2xl shrink-0">

              <div className="mt-4 flex justify-around border-t border-white/20 pt-4 uppercase">
                  {[ {l:'TARIKH', v:data.date}, {l:'TEMPAT', v:data.venue}, {l:'MASA', v:data.time}, {l:'SASARAN', v:data.target} ].map((x,i) => (
                      <div key={i} className="text-center px-3">
                          <span className="text-[11px] text-slate-400 block font-black mb-0.5">{x.l}</span>
                          <span className="text-[11px] text-white font-black">{x.v || "-"}</span>
                      </div>
                  ))}

          </div>
          <div className="flex-1 p-6 flex flex-col gap-4 overflow-hidden">
              <div className="grid grid-cols-3 gap-4 h-[35%] shrink-0 overflow-hidden">
                   <div className="bg-white p-3 rounded-2xl shadow-md border-b-4 border-blue-600">
                      <h4 className="text-blue-600 text-[10px] font-black uppercase tracking-widest">OBJEKTIF</h4>
                      <div className="report-content-text font-bold leading-tight">{data.objectives}</div>
                  </div>
                   <div className="bg-white p-3 rounded-2xl shadow-md border-b-4 border-blue-400">
                      <h4 className="text-blue-500 text-[10px] font-black uppercase tracking-widest">AKTIVITI</h4>
                      <div className="report-content-text font-bold leading-tight">{data.activities}</div>
                  </div>
                   <div className="bg-white p-3 rounded-2xl shadow-md border-b-4 border-indigo-400">
                      <h4 className="text-indigo-500 text-[10px] font-black uppercase tracking-widest">RUMUSAN</h4>
                      <div className="report-content-text font-bold italic leading-tight">{data.summary}</div>
                  </div>
              </div>
              <div className="h-[30%] grid grid-cols-4 gap-3 shrink-0">
                  {images.map((img, i) => (
                      <div key={i} className="rounded-2xl border-4 border-white shadow-lg overflow-hidden bg-slate-200 relative h-full">
                          {img ? <img src={img} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-300 text-[10px] font-black">G{i+1}</div>}
                      </div>
                  ))}
              </div>
              <div className="flex-1 grid grid-cols-2 gap-5 overflow-hidden">
                  <div className="bg-blue-600 text-white p-5 rounded-[2.5rem] shadow-xl flex flex-col overflow-hidden">
                      <h4 className="text-[10px] border-b border-white/20 pb-1 mb-2 font-black uppercase tracking-widest shrink-0">IMPAK PROGRAM</h4>
                      <div className="report-content-text font-bold italic flex-1 overflow-hidden">"{data.impact}"</div>
                  </div>
                  <div className="bg-emerald-600 text-white p-5 rounded-[2.5rem] shadow-xl flex flex-col overflow-hidden">
                      <h4 className="text-[10px] border-b border-white/20 pb-1 mb-2 font-black uppercase tracking-widest shrink-0">TINDAK SUSUL</h4>
                      <div className="report-content-text font-bold italic flex-1 overflow-hidden">"{data.suggestions}"</div>
                  </div>

    );

    const TemplateT4 = ({ data, images }) => (
      <div id="report-element" className="p-8 flex flex-col h-full bg-white overflow-hidden uppercase w-full">
          <UnifiedHeader data={data} />
          <div className="grid grid-cols-4 gap-2 mt-4 shrink-0 uppercase">
            {[ {l:'Tarikh',v:data.date}, {l:'Masa',v:data.time}, {l:'Tempat',v:data.venue}, {l:'Sasaran',v:data.target} ].map((x, i) => (
              <div key={i} className="bg-slate-50 border rounded-xl p-2 flex flex-col items-center min-w-0">
                <span className="text-[10px] text-slate-400 block font-bold uppercase">{x.l}</span>
                <span className="text-[10px] font-normal uppercase text-center w-full">{x.v || "-"}</span>
              </div>
            ))}
          </div>
          <div className="grid grid-cols-2 gap-3 my-4 shrink-0 h-[38%]">
              {images.slice(0,4).map((img, i) => (
                <div key={i} className="rounded-[2rem] border shadow-md overflow-hidden bg-slate-50 w-full h-full relative">
                  {img ? <img src={img} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-200 text-[9px]">G{i+1}</div>}
                </div>
              ))}
          </div>
          <div className="grid grid-cols-2 gap-4 flex-1 overflow-hidden mt-4">
              <div className="flex flex-col gap-3 overflow-hidden">
                  <div className="border-l-4 border-blue-600 pl-4 h-[15%] overflow-hidden bg-white shrink-0">
                      <h4 className="text-[10px] text-blue-600 mb-1 font-black uppercase">AKTIVITI</h4>
                      <div className="report-content-text">{data.activities}</div>
                  </div>
                  <div className="bg-indigo-50 p-4 rounded-3xl h-[42%] overflow-hidden border border-indigo-100 shrink-0">
                      <h4 className="text-[10px] text-indigo-700 mb-1 font-black uppercase">RUMUSAN</h4>
                      <div className="report-content-text italic">{data.summary}</div>
                  </div>
                  <div className="bg-slate-50 p-4 rounded-3xl flex-1 overflow-hidden border flex flex-col">
                      <h4 className="text-[10px] text-slate-500 mb-2 font-black uppercase">IMPAK PROGRAM</h4>
                      <div className="report-content-text italic flex-1 overflow-hidden">"{data.impact}"</div>
                  </div>
              </div>
              <div className="flex flex-col gap-4 overflow-hidden font-normal uppercase">
                  <div className="bg-blue-50 p-4 rounded-3xl border border-blue-100 h-[45%] overflow-hidden shrink-0">
                      <h4 className="text-[11px] text-blue-600 mb-2 font-black uppercase">OBJEKTIF</h4>
                      <div className="report-content-text">{data.objectives}</div>
                  </div>
                  <div className="bg-emerald-50 p-4 rounded-3xl border border-emerald-100 flex-1 overflow-hidden">
                      <h4 className="text-[11px] text-emerald-800 mb-1 font-black uppercase whitespace-nowrap">TINDAK SUSUL</h4>
                      <div className="report-content-text italic">"{data.suggestions}"</div>
                  </div>
              </div>
          </div>
      </div>
    );

    const TemplateRouter = ({ id, data, images }) => {
      switch(id) {
        case 'T2': return <TemplateT2 data={data} images={images} />;
        case 'T3': return <TemplateT3 data={data} images={images} />;
        case 'T4': return <TemplateT4 data={data} images={images} />;
        default: return <TemplateT1 data={data} images={images} />;
      }
    };

    // ========= MAIN APP =========
    function App() {
      const [isProcessing, setIsProcessing] = useState(false);
      const [status, setStatus] = useState({ type: '', text: '' });
      const [selectedTemplate, setSelectedTemplate] = useState('T1');
      const [images, setImages] = useState([null, null, null, null]);
      const [inputMethod, setInputMethod] = useState('manual');
      const [archiveSearch, setArchiveSearch] = useState("");
      const [archiveItems, setArchiveItems] = useState([]);
      const [isArchiveOpen, setIsArchiveOpen] = useState(false);

      // ===== FALLBACK STATE =====
      // chainStatus: array objek { ...model, state: 'pending' | 'trying' | 'success' | 'failed' }
      const [chainStatus, setChainStatus] = useState(AI_MODELS.map(m => ({ ...m, state: 'pending' })));
      const [activeModel, setActiveModel] = useState(null);

      const [formData, setFormData] = useState({
        schoolName: 'SMK TINGGI KUCHING',
        accountability: '3.1 PENGURUSAN KURIKULUM',
        mainTask: '3.1.1 KETETAPAN PELAKSANAAN KURIKULUM',
        programName: '', date: '', time: '', venue: '', target: '', objectives: '', activities: '', summary: '', impact: '', suggestions: ''
      });

      const fileInputRef = useRef(null);

      useEffect(() => {
        if (status.text && status.type !== 'info') {
          const t = setTimeout(() => setStatus({ type: '', text: '' }), 4500);
          return () => clearTimeout(t);
        }
      }, [status]);

      // Reset visualizer ke pending
      const resetChainStatus = () => {
        setChainStatus(AI_MODELS.map(m => ({ ...m, state: 'pending' })));
      };

      // Update 1 model dalam chain
      const updateModelState = (modelId, newState) => {
        setChainStatus(prev => prev.map(m => m.id === modelId ? { ...m, state: newState } : m));
      };

      // ====== AUTO FALLBACK CALLER ======
      const callGeminiWithFallback = async (requestBody) => {
        resetChainStatus();
        let lastError = null;

        for (let i = 0; i < AI_MODELS.length; i++) {
          const model = AI_MODELS[i];
          updateModelState(model.id, 'trying');

          try {
            setStatus({
              type: 'info',
              text: i === 0
                ? `🚀 MENCUBA MODEL UTAMA: ${model.label}...`
                : `⚡ AUTO-FALLBACK #${i} → ${model.label}...`
            });

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model.id}:generateContent?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
              }
            );

            if (!res.ok) {
              const errText = await res.text();
              lastError = new Error(`${model.label}: HTTP ${res.status}`);
              updateModelState(model.id, 'failed');
              console.warn(`[Fallback] ${model.label} gagal:`, errText.substring(0, 200));
              continue;
            }

            const result = await res.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!text) {
              lastError = new Error(`${model.label}: Respons kosong`);
              updateModelState(model.id, 'failed');
              continue;
            }

            // Berjaya!
            updateModelState(model.id, 'success');
            setActiveModel(model);
            return { text, modelUsed: model, attemptIndex: i };

          } catch (e) {
            lastError = e;
            updateModelState(model.id, 'failed');
            console.warn(`[Fallback] ${model.label} exception:`, e.message);
            continue;
          }
        }

        throw lastError || new Error("Semua 5 model AI gagal dihubungi.");
      };

      // ====== ANALISIS DOKUMEN ======
      const callGeminiAI = async (prompt, fileBase64 = null, mimeType = "image/png") => {
        if (!apiKey) return setStatus({ type: 'error', text: 'SILA MASUKKAN API KEY.' });
        setIsProcessing(true);

        try {
          const base64Data = fileBase64 && fileBase64.includes(',') ? fileBase64.split(',')[1] : fileBase64;

          const body = {
            contents: [{
              parts: [
                { text: prompt },
                ...(base64Data ? [{ inlineData: { mimeType: mimeType, data: base64Data } }] : [])
              ]
            }],
            systemInstruction: {
              parts: [{
                text: `Analisis maklumat laporan. Jawab HANYA JSON: {
                  "program": "Nama program (HURUF BESAR)",
                  "accountability": "Pilih nilai yang TEPAT dari: 3.1 PENGURUSAN KURIKULUM / 3.2 PENGURUSAN KOKURIKULUM / 3.3 PENGURUSAN HAL EHWAL MURID / 5. KEMENJADIAN MURID",
                  "mainTask": "Pilih Aspek SK@S yang paling relevan dengan accountability yang dipilih",
                  "tarikh": "Hari Bulan Tahun",
                  "masa": "Masa program",
                  "tempat": "Lokasi",
                  "sasaran": "Pecahan peserta",
                  "objektif": "Format bullet •",
                  "aktiviti": "Ringkasan maks 4 baris",
                  "rumusan": "Ulasan 40-50 perkataan. Bullet •.",
                  "impak": "Ulasan 60-70 perkataan. Bullet •.",
                  "tindak_susul": "2 langkah tindak susul. Bullet •."
                }`
              }]
            },
            generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
          };

          const { text, modelUsed, attemptIndex } = await callGeminiWithFallback(body);
          const cleanedText = text.replace(/```json|```/g, "").trim();
          const ai = JSON.parse(cleanedText);

          const validAcc = aspekMapping[ai.accountability] ? ai.accountability : '3.1 PENGURUSAN KURIKULUM';
          const validTask = aspekMapping[validAcc].includes(ai.mainTask) ? ai.mainTask : aspekMapping[validAcc][0];

          setFormData(prev => ({
            ...prev,
            programName: ai.program || "",
            accountability: validAcc,
            mainTask: validTask,
            date: ai.tarikh || "",
            time: ai.masa || "",
            venue: ai.tempat || "",
            target: ai.sasaran || "",
            objectives: ai.objektif || "",
            activities: ai.aktiviti || "",
            summary: ai.rumusan || "",
            impak: ai.impak || "",
            impact: ai.impak || "",
            suggestions: ai.tindak_susul || ""
          }));

          const fallbackNote = attemptIndex > 0 ? ` (selepas ${attemptIndex} fallback)` : '';
          setStatus({ type: 'success', text: `✅ ANALISIS BERJAYA DENGAN ${modelUsed.label}${fallbackNote}!` });
        } catch (e) {
          console.error("AI Error:", e);
          setStatus({ type: 'error', text: `❌ SEMUA MODEL GAGAL: ${e.message}` });
        } finally {
          setIsProcessing(false);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          callGeminiAI("Ekstrak maklumat dari fail ini secara lengkap.", ev.target.result, file.type);
        };
        reader.readAsDataURL(file);
      };

      const handlePaste = (e) => {
        if (inputMethod !== 'tampal') return;
        const itm = e.clipboardData.items;
        for (let x of itm) {
          if (x.type.indexOf("image") !== -1) {
            const rd = new FileReader();
            rd.onload = (ev) => callGeminiAI("Analisis gambar laporan ini.", ev.target.result, "image/png");
            rd.readAsDataURL(x.getAsFile());
            return;
          }
        }
        const text = e.clipboardData.getData('text');
        if (text.length > 5) callGeminiAI(`Ekstrak maklumat dari teks ini: ${text}`);
      };

      const generateField = async (field) => {
        if (!apiKey) return setStatus({ type: 'error', text: 'SILA MASUKKAN API KEY.' });
        const fieldLabels = { summary: 'Rumusan', impact: 'Impak', suggestions: 'Tindak Susul' };
        setIsProcessing(true);
        try {
          const prompt = `Berdasarkan Program: ${formData.programName}, Objektif: ${formData.objectives}. Jana ulasan ${fieldLabels[field]} dalam Bahasa Melayu (maks 50 patah perkataan, Standard Case).`;
          const body = { contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.7 } };
          const { text, modelUsed, attemptIndex } = await callGeminiWithFallback(body);
          if (text) {
            setFormData(prev => ({ ...prev, [field]: text.trim() }));
            const fallbackNote = attemptIndex > 0 ? ` (fallback #${attemptIndex})` : '';
            setStatus({ type: 'success', text: `✅ ${fieldLabels[field].toUpperCase()} DIJANA (${modelUsed.label}${fallbackNote})` });
          }
        } catch (e) {
          setStatus({ type: 'error', text: `❌ RALAT JANA: ${e.message}` });
        } finally {
          setIsProcessing(false);
        }
      };

      const saveToCloud = async () => {
        if (!APP_SCRIPT_URL) { setStatus({ type: 'error', text: 'URL APPSCRIPT TIDAK DITETAPKAN.' }); return; }
        setIsProcessing(true);
        setStatus({ type: 'info', text: 'MENJANA PDF & MENYIMPAN...' });
        try {
          window.scrollTo(0, 0);
          const element = document.querySelector(".paper-container");
          const opt = { margin: 0, filename: `OPR_${formData.programName}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, letterRendering: true, scrollX: 0, scrollY: 0 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } };
          const worker = html2pdf().set(opt).from(element).toPdf().get('pdf');
          await worker.then(async (pdf) => {
            const pageCount = pdf.internal.getNumberOfPages();
            if (pageCount > 1) pdf.deletePage(pageCount);
            const pdfBase64 = pdf.output('datauristring');
            const payload = { ...formData, images: images.filter(i => i !== null), pdfBase64 };
            const res = await fetch(APP_SCRIPT_URL, { method: 'POST', mode: 'cors', body: JSON.stringify(payload) });
            const result = await res.json();
            if (result.status === "success") setStatus({ type: 'success', text: 'DATA DISIMPAN KE CLOUD & DRIVE!' });
            else throw new Error(result.message);
          });
        } catch (e) { setStatus({ type: 'error', text: 'RALAT SIMPAN DATA.' }); }
        finally { setTimeout(() => setIsProcessing(false), 2000); }
      };

      const fetchFromCloud = async () => {
        if (!APP_SCRIPT_URL) { setStatus({ type: 'error', text: 'URL APPSCRIPT TIDAK DITETAPKAN.' }); return; }
        setIsProcessing(true);
        try {
          const res = await fetch(APP_SCRIPT_URL);
          const data = await res.json();
          if (Array.isArray(data)) { setArchiveItems(data.reverse()); setIsArchiveOpen(true); }
          else { throw new Error(); }
        } catch (e) { setStatus({ type: 'error', text: 'ARKIB KOSONG ATAU RALAT APPSCRIPT.' }); }
        finally { setIsProcessing(false); }
      };

      const loadArchiveData = (item) => {
        setFormData({ ...formData, ...item });
        if (item.images) {
          const newImgs = [null, null, null, null];
          item.images.forEach((img, i) => { if (i < 4) newImgs[i] = img; });
          setImages(newImgs);
        }
        setIsArchiveOpen(false);
        setStatus({ type: 'success', text: 'REKOD DIMUATKAN DARI CLOUD!' });
      };

      const filteredArchive = useMemo(() => {
        return archiveItems.filter(item =>
          (item.programName && item.programName.toLowerCase().includes(archiveSearch.toLowerCase())) ||
          (item.date && String(item.date).includes(archiveSearch))
        );
      }, [archiveItems, archiveSearch]);

      const handleImagePaste = (e, index) => {
        const itm = e.clipboardData.items;
        for (let x of itm) {
          if (x.type.indexOf("image") !== -1) {
            const rd = new FileReader();
            rd.onload = (f) => { const n = [...images]; n[index] = f.target.result; setImages(n); };
            rd.readAsDataURL(x.getAsFile());
          }
        }
      };

      return (
        <div className="flex flex-col lg:flex-row h-screen overflow-hidden text-slate-800">

          {/* ================= SIDEBAR ================= */}
          <aside className="w-full lg:w-[400px] glass border-r border-white/60 overflow-y-auto custom-scrollbar shadow-2xl z-20 print-hide">

            <div className="p-6">
              {/* Header Card */}
              <div className="relative overflow-hidden rounded-3xl p-5 mb-5" style={{background: 'linear-gradient(135deg, #1e1b4b 0%, #4338ca 50%, #6d28d9 100%)'}}>
                <div className="absolute -top-6 -right-6 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
                <div className="absolute -bottom-8 -left-8 w-32 h-32 bg-fuchsia-500/20 rounded-full blur-3xl"></div>
                <div className="relative flex items-center gap-3 text-white">
                  <div className="w-12 h-12 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center shrink-0 border border-white/20">
                    <IconBrain />
                  </div>
                  <div className="flex-1 min-w-0">
                    <h1 className="font-display text-lg font-bold leading-tight tracking-tight">OPR PROGRAM DAN AKTIVITI</h1>
                    <p className="text-[11px] text-indigo-200 font-medium">Auto-Fallback Edition · V12.1</p>
                  </div>
                </div>
                <div className="mt-4 flex items-center gap-2 text-[18px] text-indigo-200 font-medium">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>SMK TINGGI KUCHING</span>
                </div>
              </div>

              {/* ===== AI AUTO-FALLBACK CHAIN VISUALIZER ===== */}
              <div className="mb-5 p-4 bg-white/85 rounded-2xl border border-slate-200/80 shadow-sm">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="badge-ai uppercase">AI Engine</span>
                    <h3 className="text-[11px] font-bold text-slate-700 uppercase tracking-wide">Auto Fallback Chain</h3>
                  </div>
                  <span className="badge-auto uppercase">
                    <IconBolt /> AUTO
                  </span>
                </div>

                {/* Chain Visualizer */}
                <div className="flex flex-wrap items-center gap-1 mb-3">
                  {chainStatus.map((m, idx) => (
                    <React.Fragment key={m.id}>
                      <div
                        className={`chain-node ${m.state} px-2 py-1.5 rounded-lg text-[9px] font-bold flex items-center gap-1`}
                        title={m.desc}
                      >
                        <span className="font-display">{m.tier}</span>
                        <span>{m.label}</span>
                        {m.state === 'success' && <IconCheck />}
                        {m.state === 'trying' && <div className="w-2 h-2 border-2 border-amber-700 border-t-transparent rounded-full animate-spin"></div>}
                      </div>
                      {idx < chainStatus.length - 1 && (
                        <span className="chain-arrow text-[9px]">→</span>
                      )}
                    </React.Fragment>
                  ))}
                </div>

                {/* Info Box */}
                <div className="bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100 rounded-xl p-2.5">
                  <p className="text-[9px] text-indigo-900 leading-relaxed font-medium">
                    <span className="font-bold">ℹ️ Cara kerja:</span> Sistem cuba <span className="font-bold">2.5 Flash</span> dahulu. Jika gagal → auto-cuba model seterusnya mengikut susunan sehingga berjaya.
                  </p>
                  {activeModel && (
                    <div className="mt-2 pt-2 border-t border-indigo-100 flex items-center justify-between">
                      <span className="text-[9px] font-bold text-slate-600 uppercase">Terakhir Berjaya:</span>
                      <span className="text-[9px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">
                        ✓ {activeModel.label}
                      </span>
                    </div>
                  )}
                </div>
              </div>

              {/* Input Method */}
              <div className="mb-4">
                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">Kaedah Input</label>
                <div className="grid grid-cols-3 gap-2">
                   <button onClick={() => setInputMethod('tampal')} className={`method-card p-3 rounded-2xl bg-white flex flex-col items-center gap-1.5 ${inputMethod === 'tampal' ? 'method-active' : 'text-slate-400 border-slate-200'}`}>
                     <IconPaste /><span className="text-[10px] font-bold uppercase">Tampal</span>
                   </button>
                   <button onClick={() => setInputMethod('upload')} className={`method-card p-3 rounded-2xl bg-white flex flex-col items-center gap-1.5 ${inputMethod === 'upload' ? 'method-active' : 'text-slate-400 border-slate-200'}`}>
                     <IconUpload /><span className="text-[10px] font-bold uppercase">Upload</span>
                   </button>
                   <button onClick={() => setInputMethod('manual')} className={`method-card p-3 rounded-2xl bg-white flex flex-col items-center gap-1.5 ${inputMethod === 'manual' ? 'method-active' : 'text-slate-400 border-slate-200'}`}>
                     <IconManual /><span className="text-[10px] font-bold uppercase">Manual</span>
                   </button>
                </div>
              </div>

              {/* Drop Zone */}
              {inputMethod !== 'manual' && (
                <div
                  onClick={() => inputMethod === 'upload' && fileInputRef.current.click()}
                  onPaste={handlePaste}
                  tabIndex="0"
                  className={`p-8 rounded-3xl border-2 border-dashed text-center mb-5 relative cursor-pointer transition-all ${isProcessing ? 'pulse-glow' : ''} bg-gradient-to-br from-indigo-50 via-white to-purple-50 border-indigo-300 hover:border-indigo-500 hover:shadow-lg`}
                >
                  <div className="w-12 h-12 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg">
                    {inputMethod === 'upload' ? <IconUpload /> : <IconPaste />}
                  </div>
                  <p className="text-[11px] font-bold text-indigo-900 uppercase tracking-wide">
                    {inputMethod === 'upload' ? 'Klik untuk Upload' : 'Klik & Tekan Ctrl+V'}
                  </p>
                  <p className="text-[9px] text-indigo-400 mt-1 font-medium normal-case">
                    {inputMethod === 'upload' ? 'Sokong: Image, PDF, DOC, DOCX' : 'Tampal imej atau teks laporan'}
                  </p>
                  <input type="file" ref={fileInputRef} className="hidden" accept="image/*,.pdf,.doc,.docx" onChange={handleFileUpload} />
                  {isProcessing && (
                    <div className="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center rounded-3xl gap-2">
                      <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                      <p className="text-[9px] font-bold text-indigo-600 uppercase">AUTO-FALLBACK AKTIF...</p>
                    </div>
                  )}
                </div>
              )}

              {/* Status Toast */}
              {status.text && (
                <div className={`p-3 mb-4 rounded-2xl text-[10px] font-bold uppercase fade-in-up ${status.type === 'error' ? 'toast-error' : status.type === 'success' ? 'toast-success' : 'toast-info'}`}>
                  {status.text}
                </div>
              )}

              {/* Form Fields */}
              <div className="space-y-3">
                <div>
                  <label className="text-[10px] font-bold text-indigo-600 uppercase tracking-wide block mb-1.5">Standard SK@S</label>
                  <select
                    className="input-modern w-full px-4 py-3 text-[11px] rounded-2xl font-bold uppercase"
                    value={formData.accountability}
                    onChange={e => {
                      const selectedStandard = e.target.value;
                      const defaultAspek = aspekMapping[selectedStandard][0];
                      setFormData({...formData, accountability: selectedStandard, mainTask: defaultAspek});
                    }}
                  >
                    <option value="3.1 PENGURUSAN KURIKULUM">3.1 PENGURUSAN KURIKULUM</option>
                    <option value="3.2 PENGURUSAN KOKURIKULUM">3.2 PENGURUSAN KOKURIKULUM</option>
                    <option value="3.3 PENGURUSAN HAL EHWAL MURID">3.3 PENGURUSAN HAL EHWAL MURID</option>
                    <option value="5. KEMENJADIAN MURID">5. KEMENJADIAN MURID</option>
                  </select>
                </div>

                <div>
                  <label className="text-[10px] font-bold text-indigo-600 uppercase tracking-wide block mb-1.5">Aspek SK@S</label>
                  <select
                    className="input-modern w-full px-4 py-3 text-[11px] rounded-2xl font-bold uppercase"
                    value={formData.mainTask}
                    onChange={e => setFormData({...formData, mainTask: e.target.value})}
                  >
                    {(aspekMapping[formData.accountability] || []).map((aspek, index) => (
                      <option key={index} value={aspek}>{aspek}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wide block mb-1.5">Nama Program</label>
                  <input className="input-modern w-full px-4 py-3 text-[11px] rounded-2xl font-bold uppercase" value={formData.programName} onChange={e => setFormData({...formData, programName: e.target.value})} placeholder="Masukkan nama program..." />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Tarikh</label>
                    <input className="input-modern w-full px-3 py-2.5 text-[11px] rounded-xl font-bold" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} placeholder="1 Januari 2026" />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Masa</label>
                    <input className="input-modern w-full px-3 py-2.5 text-[11px] rounded-xl font-bold" value={formData.time} onChange={e => setFormData({...formData, time: e.target.value})} placeholder="8:00 pagi" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Tempat</label>
                    <input className="input-modern w-full px-3 py-2.5 text-[11px] rounded-xl font-bold uppercase" value={formData.venue} onChange={e => setFormData({...formData, venue: e.target.value})} />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Sasaran</label>
                    <input className="input-modern w-full px-3 py-2.5 text-[11px] rounded-xl font-bold uppercase" value={formData.target} onChange={e => setFormData({...formData, target: e.target.value})} />
                  </div>
                </div>

                <div>
                  <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Objektif</label>
                  <textarea className="input-modern w-full px-3 py-2.5 text-[11px] rounded-xl font-semibold min-h-[60px] resize-none" value={formData.objectives} onChange={e => setFormData({...formData, objectives: e.target.value})} />
                </div>

                <div>
                  <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Aktiviti / Pengisian</label>
                  <textarea className="input-modern w-full px-3 py-2.5 text-[11px] rounded-xl font-semibold min-h-[60px] resize-none" value={formData.activities} onChange={e => setFormData({...formData, activities: e.target.value})} />
                </div>

                {['summary', 'impact', 'suggestions'].map((f) => (
                  <div key={f}>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-[10px] font-bold text-slate-500 uppercase">
                        {f === 'summary' ? 'Rumusan' : f === 'impact' ? 'Impak' : 'Tindak Susul'}
                      </label>
                      <button
                        onClick={() => generateField(f)}
                        disabled={isProcessing}
                        className="btn-gradient-primary text-white text-[9px] px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 uppercase disabled:opacity-50"
                      >
                        <IconSparkles /> Jana
                      </button>
                    </div>
                    <textarea className="input-modern w-full px-3 py-2.5 text-[11px] rounded-xl font-semibold min-h-[70px] italic bg-slate-50 resize-none" value={formData[f]} onChange={e => setFormData({...formData, [f]: e.target.value})} />
                  </div>
                ))}

                {/* Galeri Imej */}
                <div>
                  <label className="text-[10px] font-bold text-slate-500 uppercase block mb-2">Galeri Imej (4)</label>
                  <div className="grid grid-cols-4 gap-2">
                    {images.map((img, i) => (
                      <div key={i} className="aspect-square border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center bg-slate-50 hover:border-indigo-400 hover:bg-indigo-50 relative overflow-hidden transition-all focus-within:ring-2 focus-within:ring-indigo-300" onPaste={(e) => handleImagePaste(e, i)} tabIndex="0">
                        {img ? (
                          <>
                            <img src={img} className="w-full h-full object-cover rounded-lg" />
                            <button onClick={() => { const n = [...images]; n[i] = null; setImages(n); }} className="absolute top-1 right-1 bg-red-500 hover:bg-red-600 text-white rounded-full p-1 shadow-md transition-transform hover:scale-110">
                              <IconTrash />
                            </button>
                          </>
                        ) : (
                          <div className="flex flex-col items-center gap-0.5 text-slate-400">
                            <span className="text-lg font-light">+</span>
                            <span className="text-[8px] font-bold">G{i+1}</span>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                  <p className="text-[9px] text-slate-400 mt-1.5 font-medium">Klik kotak & tampal (Ctrl+V)</p>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="pt-6 grid grid-cols-2 gap-2.5">
                 <button onClick={() => window.print()} className="btn-gradient-success py-3 text-white rounded-2xl text-[10px] font-bold uppercase flex items-center justify-center gap-2">
                   <IconPrinter /> Cetak PDF
                 </button>
                 <button onClick={() => {
                     const content = document.getElementById("report-element").innerHTML;
                     const blob = new Blob(['\ufeff', `<html><head><meta charset='utf-8'></head><body style='font-family:Arial'>${content}</body></html>`], { type: 'application/msword' });
                     const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `${formData.programName || 'OPR'}.doc`; link.click();
                 }} className="btn-gradient-word py-3 text-white rounded-2xl text-[10px] font-bold uppercase flex items-center justify-center gap-2">
                   <IconWord /> Word
                 </button>
                 <button onClick={saveToCloud} className="btn-gradient-cloud py-3 text-white rounded-2xl text-[10px] font-bold uppercase flex items-center justify-center gap-2">
                   <IconCloud /> Simpan Cloud
                 </button>
                 <button onClick={fetchFromCloud} className="btn-gradient-archive py-3 text-white rounded-2xl text-[10px] font-bold uppercase flex items-center justify-center gap-2">
                   <IconArchive /> Arkib Cloud
                 </button>
                 <button onClick={() => location.reload()} className="btn-gradient-danger py-2.5 text-white rounded-2xl text-[10px] col-span-2 font-bold uppercase flex items-center justify-center gap-2 mt-1">
                   <IconRefresh /> Reset Borang
                 </button>
              </div>

              <div className="mt-6 pt-4 border-t border-slate-200 text-center">
                <p className="text-[9px] text-slate-400 font-medium">AI SMART OPR · Auto-Fallback Edition V12.1</p>
                <p className="text-[8px] text-slate-300 mt-0.5">5 Model Gemini · Seamless Failover</p>
              </div>
            </div>
          </aside>

          {/* ================= MAIN PREVIEW ================= */}
          <main className="flex-1 flex flex-col items-center p-4 lg:p-8 overflow-y-auto custom-scrollbar relative">

            {/* Top Toolbar */}
            <div className="w-full max-w-4xl mb-6 flex items-center justify-between gap-3 sticky top-0 z-30 print-hide">
              <div className="flex items-center gap-2">
                <div className="glass px-4 py-2.5 rounded-2xl shadow-lg border border-white/50 flex items-center gap-2">
                  <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Template:</span>
                  <select
                    className="bg-transparent text-[11px] font-bold uppercase outline-none cursor-pointer text-indigo-700"
                    value={selectedTemplate}
                    onChange={e => setSelectedTemplate(e.target.value)}
                  >
                    {globalTemplates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                </div>
              </div>

              <div className="glass px-4 py-2.5 rounded-2xl shadow-lg border border-white/50 flex items-center gap-2">
                <div className={`w-2 h-2 rounded-full ${isProcessing ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'}`}></div>
                <span className="text-[10px] font-bold text-slate-600 uppercase tracking-wide">
                  {isProcessing ? 'Auto-Fallback' : 'Bersedia'}
                </span>
                {activeModel && !isProcessing && (
                  <span className="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-200 ml-1">
                    ✓ {activeModel.label}
                  </span>
                )}
              </div>
            </div>

            {/* Paper Preview */}
            <div className="mb-20 transform scale-[0.38] md:scale-[0.65] xl:scale-[0.92] origin-top transition-all print:scale-100 print:m-0">
              <div className="paper-container select-text">
                <TemplateRouter id={selectedTemplate} data={formData} images={images} />
              </div>
            </div>
          </main>

          {/* ================= ARCHIVE MODAL ================= */}
          {isArchiveOpen && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] flex items-center justify-center p-6 fade-in-up">
              <div className="bg-white w-full max-w-2xl rounded-[2.5rem] shadow-2xl flex flex-col relative overflow-hidden border border-white/50">
                <div className="absolute top-0 left-0 right-0 h-32 bg-gradient-to-br from-indigo-600 to-purple-700"></div>

                <button onClick={() => setIsArchiveOpen(false)} className="absolute top-5 right-5 w-10 h-10 rounded-full bg-white/20 backdrop-blur text-white flex items-center justify-center font-bold hover:bg-white/30 transition-colors z-10">
                  <IconX />
                </button>

                <div className="relative p-8 pt-10 text-center">
                  <div className="inline-flex items-center gap-2 bg-white/20 backdrop-blur px-4 py-1.5 rounded-full mb-3 border border-white/30">
                    <IconArchive />
                    <span className="text-[10px] font-bold text-white uppercase tracking-widest">Digital Archive</span>
                  </div>
                  <h2 className="font-display text-2xl font-bold text-white mb-5 tracking-tight">Arkib OPR</h2>
                  <input
                    type="text"
                    placeholder="🔍  Cari tajuk program atau tarikh..."
                    className="w-full px-5 py-4 bg-white/95 border-0 rounded-2xl text-sm font-semibold outline-none focus:ring-4 focus:ring-white/40 transition-all shadow-lg"
                    value={archiveSearch}
                    onChange={(e) => setArchiveSearch(e.target.value)}
                  />
                </div>

                <div className="flex-1 overflow-y-auto px-8 pb-4 max-h-[45vh] custom-scrollbar bg-slate-50">
                  <div className="space-y-2.5 pt-4">
                    {filteredArchive.length > 0 ? filteredArchive.map((item, idx) => (
                      <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between group hover:border-indigo-400 hover:shadow-md transition-all">
                        <div className="flex-1 pr-4 min-w-0">
                          <h3 className="font-bold text-[12px] text-slate-800 leading-tight mb-1 uppercase truncate">{item.programName || "TIADA TAJUK"}</h3>
                          <p className="text-[10px] text-slate-400 font-semibold">{item.date || "-"} · {item.venue || "-"}</p>
                        </div>
                        <div className="flex gap-2 shrink-0">
                           {item.pdfUrl && (
                             <button onClick={() => window.open(item.pdfUrl, '_blank')} className="btn-gradient-archive text-white px-4 py-2 rounded-xl text-[9px] font-bold uppercase">
                               PDF
                             </button>
                           )}
                           <button onClick={() => loadArchiveData(item)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-[9px] font-bold uppercase transition-colors">
                             Buka
                           </button>
                        </div>
                      </div>
                    )) : (
                      <div className="text-center py-12">
                        <div className="w-16 h-16 mx-auto mb-3 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400">
                          <IconArchive />
                        </div>
                        <p className="text-[11px] font-bold uppercase text-slate-400">Tiada Rekod Dijumpai</p>
                      </div>
                    )}
                  </div>
                </div>

                <div className="p-8 pt-4 bg-slate-50 border-t border-slate-100">
                  <button onClick={fetchFromCloud} className="btn-gradient-primary w-full py-4 text-white rounded-2xl text-[11px] font-bold uppercase flex items-center justify-center gap-2">
                    <IconRefresh /> Kemaskini dari Cloud
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
